name: xpense

x-server-runtime: &server-runtime
  image: xpense-server:local
  build:
    context: ../..
    dockerfile: infra/compose/Dockerfile.server
  environment:
    - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
    - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
    - ACCESS_TOKEN_TTL_SECONDS=${ACCESS_TOKEN_TTL_SECONDS:-900}
    - REFRESH_TOKEN_TTL_DAYS=${REFRESH_TOKEN_TTL_DAYS:-30}
    - PORT=${PORT:-4000}
    - WEB_ORIGIN=${WEB_ORIGIN:?WEB_ORIGIN is required}
    - WEB_REFRESH_TOKEN_COOKIE=${WEB_REFRESH_TOKEN_COOKIE:-xpense_refresh_token}
    - APP_REFRESH_TOKEN_TRANSPORT=${APP_REFRESH_TOKEN_TRANSPORT:-json_body}
    - SYSTEM_ROLES=${SYSTEM_ROLES:-owner,admin,member,viewer}
    - BOOTSTRAP_SOURCE=${BOOTSTRAP_SOURCE:-environment_variables}
    - PASSWORD_HASH=${PASSWORD_HASH:-argon2id}
    - ACCESS_TOKEN=${ACCESS_TOKEN:-jwt}
    - REFRESH_TOKEN=${REFRESH_TOKEN:-opaque_random_hash_at_rest}
    - BOOTSTRAP_SUPER_ADMIN_EMAIL
    - BOOTSTRAP_SUPER_ADMIN_PASSWORD
    - BOOTSTRAP_ORGANIZATION_NAME

services:
  postgres:
    image: postgres:18
    environment:
      PGDATA: /var/lib/postgresql/Xpense
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - type: bind
        source: ${POSTGRES_DATA_DIR:?POSTGRES_DATA_DIR is required}
        target: /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  db-prepare:
    <<: *server-runtime
    command: pnpm --filter @xpense/server db:prepare
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    <<: *server-runtime
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    depends_on:
      db-prepare:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- \"http://127.0.0.1:$${PORT}/ready\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  web:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}
    ports:
      - "5173:5173"
    depends_on:
      server:
        condition: service_healthy
